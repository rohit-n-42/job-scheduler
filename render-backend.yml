services:
  - type: web
    name: job-scheduler-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: WEBHOOK_URL
        value: https://webhook.site/9cfeb8a0-8baf-4081-acf2-37e89bd7c913
        # Replace with your actual webhook URL